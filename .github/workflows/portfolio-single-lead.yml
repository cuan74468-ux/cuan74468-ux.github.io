name: Portfolio one-time synthetic lead
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - 'tests/portfolio-single-lead.cjs'
permissions:
  contents: read
jobs:
  lead:
    if: github.event.pull_request.head.ref == 'qa/portfolio-single-lead-20261127' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/portfolio-single-lead.cjs
