name: Portfolio live acceptance (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/portfolio-live.cjs'
      - '.github/workflows/portfolio-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/portfolio-live.cjs
