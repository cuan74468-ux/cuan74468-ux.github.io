name: Backend QA (no build)
on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'tests/**'
      - '.github/workflows/backend-qa.yml'
  workflow_dispatch:
jobs:
  verify-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend in isolated mock environment
        run: node tests/backend.test.cjs
