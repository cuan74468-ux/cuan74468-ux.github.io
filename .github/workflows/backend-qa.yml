name: Backend QA (no build)
on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'AdminRecovery.gs'
      - 'tests/**'
      - 'js/**'
      - 'index.html'
      - '.github/workflows/backend-qa.yml'
  workflow_dispatch:
jobs:
  verify-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check (GAS source and browser JavaScript)
        run: |
          node --check < Code.gs
          node --check < AdminRecovery.gs
          for file in js/*.js; do node --check "$file"; done
      - name: Verify backend in isolated mock environment
        run: node tests/backend.test.cjs
      - name: Verify CMS DOM lifecycle regressions
        run: node tests/cms-dom.test.cjs
